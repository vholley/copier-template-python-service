name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  generation-tests:
    name: Generation tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync
      - run: uv run pytest tests/ -v

  template-ci:
    name: Template CI / ${{ matrix.label }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: minimal-no-gcp
            args: >-
              project_name=test-project
              app_framework=minimal
              use_gcp=false
              include_docker=false
          - label: fastapi-no-gcp
            args: >-
              project_name=test-project
              app_framework=fastapi
              use_gcp=false
              include_docker=false
          - label: fastapi-gcp
            args: >-
              project_name=test-project
              app_framework=fastapi
              use_gcp=true
              include_docker=true
              gcp_project_dev=my-project-dev
              gcp_project_prod=my-project-prod
          - label: minimal-gcp
            args: >-
              project_name=test-project
              app_framework=minimal
              use_gcp=true
              include_docker=true
              gcp_project_dev=my-project-dev
              gcp_project_prod=my-project-prod
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - name: Install copier
        run: uv tool install copier
      - name: Generate project
        run: copier copy --trust --defaults . /tmp/test-project -- ${{ matrix.args }}
      - name: Run make ci
        working-directory: /tmp/test-project
        run: uv sync && make ci
