name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  generation-tests:
    name: Generation tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      # --locked enforces the committed uv.lock (fails if it has drifted from
      # pyproject.toml) so the template repo's own dev tooling — copier, pytest —
      # only changes by a deliberate re-lock, not by ambient upstream releases.
      - run: uv sync --locked
      - run: uv run pytest tests/ -v

  template-ci:
    name: Template CI / ${{ matrix.label }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: minimal-no-gcp
            args: >-
              -d project_name=test-project
              -d app_framework=minimal
              -d use_gcp=false
              -d include_docker=false
          - label: fastapi-no-gcp
            args: >-
              -d project_name=test-project
              -d app_framework=fastapi
              -d use_gcp=false
              -d include_docker=false
          - label: fastapi-gcp
            args: >-
              -d project_name=test-project
              -d app_framework=fastapi
              -d use_gcp=true
              -d include_docker=true
              -d gcp_project_dev=my-project-dev
              -d gcp_project_prod=my-project-prod
          - label: minimal-gcp
            args: >-
              -d project_name=test-project
              -d app_framework=minimal
              -d use_gcp=true
              -d include_docker=true
              -d gcp_project_dev=my-project-dev
              -d gcp_project_prod=my-project-prod
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - name: Install copier
        run: uv tool install copier
      - name: Generate project
        # --vcs-ref=HEAD so we test the checked-out branch, not the latest
        # release tag (copier defaults to the newest tag for git templates).
        run: copier copy --trust --defaults --vcs-ref=HEAD . /tmp/test-project ${{ matrix.args }}
      - name: Run make ci
        working-directory: /tmp/test-project
        run: uv sync && make ci
