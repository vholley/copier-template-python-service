_min_copier_version: "9.0"
_subdirectory: template
_answers_file: .copier-answers.yml

project_name:
  type: str
  help: Project name (kebab-case, e.g. my-python-service)
  default: "{{ _copier_conf.dst_path.name }}"
  validator: >-
    {% if not (project_name | regex_search('^[a-z][a-z0-9-]+[a-z0-9]$')) %}
    project_name must be lowercase kebab-case (letters, digits, hyphens; starts with a letter, ends with a letter or digit)
    {% endif %}

python_version:
  type: str
  help: Python version
  default: "3.14"
  choices:
    - "3.13"
    - "3.14"

app_framework:
  type: str
  help: Web framework for generated apps
  choices:
    - minimal
    - fastapi
  default: minimal

use_gcp:
  type: bool
  help: Add GCP deployment scaffolding (Cloud Run, Secret Manager, Cloud Logging)?
  default: false

gcp_project_dev:
  type: str
  help: GCP dev project ID (e.g. my-project-dev)
  when: "{{ use_gcp }}"

gcp_project_prod:
  type: str
  help: GCP prod project ID (e.g. my-project-prod)
  when: "{{ use_gcp }}"

include_docker:
  type: bool
  help: Include Dockerfile and container build scaffolding?
  default: "{{ use_gcp }}"

include_terraform:
  type: bool
  help: Include Terraform infrastructure scaffolding?
  default: false

enable_delivery:
  type: bool
  help: Install the quality-first delivery system (working/, .claude/ process, delivery checks and workflows)?
  default: true

owner_group:
  type: str
  help: Optional GitHub handle to auto-request for review on protected paths (e.g. @org/platform or @username). Leave empty for no CODEOWNERS.
  default: ""
  when: "{{ enable_delivery }}"

high_risk_paths:
  type: yaml
  help: Glob patterns for high-risk paths (second reviewer required), as a YAML list
  default: ["**/auth/**", "**/migrations/**"]
  when: "{{ enable_delivery }}"

trivial_paths:
  type: yaml
  help: Glob patterns for trivial-eligible paths (no work item needed), as a YAML list
  default: ["docs/**", "*.md", ".github/**", "**/tests/**", "pyproject.toml", "uv.lock"]
  when: "{{ enable_delivery }}"

# File exclusion rules driven by answers
_exclude:
  - "*.pyc"
  - "__pycache__"
  - ".git"
  - "{% if not include_docker %}**/Dockerfile{% endif %}"
  - "{% if not include_terraform %}infra{% endif %}"
  - "{% if not use_gcp %}libs/shared/src/shared/gcp.py{% endif %}"
  - "{% if not use_gcp or not include_docker %}.github/workflows/deploy.yml{% endif %}"
  - "{% if not use_gcp or not include_docker %}scripts/deploy.sh{% endif %}"
  - "{% if not include_terraform %}scripts/tf-bootstrap.sh{% endif %}"
  - "{% if not include_terraform or not use_gcp %}.github/workflows/terraform-plan.yml{% endif %}"
  - "{% if not include_terraform or not use_gcp %}.github/workflows/terraform-apply.yml{% endif %}"
  - "{% if not enable_delivery %}working{% endif %}"
  - "{% if not enable_delivery or not owner_group %}.github/CODEOWNERS{% endif %}"
  - "{% if not enable_delivery %}.claude/settings.json{% endif %}"
  - "{% if not enable_delivery %}.claude/commands{% endif %}"
  - "{% if not enable_delivery %}.claude/skills{% endif %}"
  - "{% if not enable_delivery %}.claude/VENDORED.md{% endif %}"
  - "{% if not enable_delivery %}.claude/agents{% endif %}"
  - "{% if not enable_delivery %}.claude/rules{% endif %}"
  - "{% if app_framework != 'fastapi' %}.claude/rules/api-design.md{% endif %}"
  - "{% if not enable_delivery %}scripts/delivery{% endif %}"
  - "{% if not enable_delivery %}scripts/hooks{% endif %}"
  - "{% if not enable_delivery %}scripts/migrate-to-delivery.sh{% endif %}"
  - "{% if not enable_delivery %}.github/workflows/delivery-checks.yml{% endif %}"
  - "{% if not enable_delivery %}.github/workflows/review-agents.yml{% endif %}"
  - "{% if not enable_delivery %}.github/workflows/spec-draft.yml{% endif %}"
  - "{% if not enable_delivery %}.github/workflows/post-merge.yml{% endif %}"
  - "{% if not enable_delivery %}.github/workflows/entropy-audit.yml{% endif %}"
  - "{% if not enable_delivery %}.github/actions/setup{% endif %}"
  - "{% if not include_docker and not enable_delivery %}.dockerignore{% endif %}"
  - "{% if not enable_delivery %}MIGRATION.md{% endif %}"
  - "{% if not enable_delivery %}docs/DELIVERY-SYSTEM.md{% endif %}"
  - "{% if not enable_delivery %}docs/workflow.mermaid{% endif %}"

# Files the project owns after first generation. Never rewritten by copier
# update, even when the template changes them.
_skip_if_exists:
  - ".claude/rules/project.md"
  - "working/spec/**"
  - "working/architecture/**"
  - "working/standards/budgets.md"
  - "working/observations.md"
  - "working/history/**"
  - ".github/CODEOWNERS"

_message_after_update: |
  Template updated.
  {% if enable_delivery %}If this project was generated before the delivery
  system existed, read MIGRATION.md and run:
    scripts/migrate-to-delivery.sh --from <a freshly generated project>
  {% endif %}

# Post-generation tasks
# git rev-list -1 HEAD succeeds only when commits exist (i.e. an existing project
# being updated). On first copy there are no commits yet, so the condition fails
# and we show the next-steps instructions. Temp dirs used internally by copier
# during update also have no commits, so they see the echo — harmless since
# those directories are deleted immediately after.
_tasks:
  - "[ -d .git ] || git init -b develop"
  # The scaffold commit. Without it the project has no commits, so git rev-parse
  # HEAD fails and every command that reads the branch raises instead of
  # answering. It is the one commit that goes straight to develop, because there
  # is no base to open a pull request against yet. Identity comes from the
  # engineer's own git config: the commit is theirs, not the template's.
  - >-
    case "$(basename "$PWD")" in copier._main.*) exit 0 ;; esac;
    git rev-list -1 HEAD >/dev/null 2>&1 && exit 0;
    if [ -z "$(git config user.name)" ] || [ -z "$(git config user.email)" ]; then
    echo '
    Generated, but not committed: git has no author identity here. Set one, then
    make the scaffold commit yourself:

      git config --global user.name "Your Name"
      git config --global user.email "you@example.com"
      git add -A && git commit -m "chore: generate from copier-template-python-service"
    ';
    exit 0;
    fi;
    git add -A;
    git commit -q -m "chore: generate from copier-template-python-service"
  - >-
    case "$(basename "$PWD")" in copier._main.*) exit 0 ;; esac;
    if git rev-list -1 HEAD >/dev/null 2>&1; then echo '
    Generation complete. Next steps:
      1. cd {{ _copier_conf.dst_path.name }}
      2. ./scripts/bootstrap.sh
      3. git checkout -b main && git checkout develop
      4. git remote add origin <your-github-repo-url>
      5. git push -u origin develop main

      Then configure branch protection and GitHub Environments — see README.md.

      To pull future template updates:
      copier update --trust --skip-answered
    '; fi
  - >-
    {% if enable_delivery %}case "$(basename "$PWD")" in copier._main.*) exit 0 ;; esac;
    if git rev-list -1 HEAD >/dev/null 2>&1; then echo '
    Delivery system installed. Two more setup steps:
      7. make hooks          (installs pre-commit and the Claude Code hooks)
      8. Register your SSH key as a GitHub signing key and protect it per use
         (see working/README.md, "Signing acceptances"). Acceptance commits
         require it; ordinary commits do not.
    '; fi{% else %}true{% endif %}
